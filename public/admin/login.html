<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login Admin - AsramaFood</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="/css/style.css"></head>
<body><div class="login-wrapper"><div class="login-card"><div style="display:flex;justify-content:flex-end"><button class="icon-btn" id="theme-toggle"><i class="fa-solid fa-moon"></i></button></div><div class="login-header"><i class="fa-solid fa-user-shield"></i><h1>AsramaFood Admin</h1><p>Masuk untuk mengelola pesanan, menu, dan toko.</p></div>
<div class="form-group"><label>Username</label><input id="username" class="form-control" autocomplete="username" placeholder="owner / kasir"></div><div class="form-group"><label>Password</label><input type="password" id="password" class="form-control" autocomplete="current-password"></div><button class="btn" id="loginBtn" onclick="login()"><i class="fa-solid fa-right-to-bracket"></i> Masuk</button><p id="errMsg" style="color:var(--danger);text-align:center;margin-top:12px;font-size:.82rem"></p><a href="/" style="display:block;text-align:center;margin-top:1rem;color:var(--primary);font-size:.82rem;font-weight:700">← Kembali ke halaman pemesanan</a></div></div>
<script src="/js/theme.js"></script><script>initThemeToggle('theme-toggle');async function login(){const u=username.value.trim(),p=password.value,b=loginBtn,e=errMsg;e.textContent='';b.disabled=true;b.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Memproses';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login gagal');location.href='/admin/index.html'}catch(x){e.textContent=x.message;b.disabled=false;b.innerHTML='<i class="fa-solid fa-right-to-bracket"></i> Masuk'}}password.addEventListener('keydown',e=>{if(e.key==='Enter')login()});</script></body></html>
