<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan - Admin AsramaFood</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="admin-body">
    <header class="admin-header">
        <div class="header-inner">
            <div style="display: flex; align-items: center; gap: 1rem;">
                <button class="icon-btn mobile-menu-btn" id="toggle-sidebar"><i aria-hidden="true" class="fa-solid fa-bars"></i></button>
                <a class="admin-brand" href="/admin/index.html"><i aria-hidden="true" class="fa-solid fa-utensils"></i> AdminPanel</a>
            </div>
            <div class="admin-header-actions">
                <button class="icon-btn" id="theme-toggle"><i aria-hidden="true" class="fa-solid fa-moon"></i></button>
                <button class="logout-btn" onclick="logout()"><i aria-hidden="true" class="fa-solid fa-arrow-right-from-bracket"></i> <span class="desktop-only" style="margin-left: 0.4rem;">Keluar</span></button>
            </div>
        </div>
    </header>

    <div class="admin-layout">
        <aside class="sidebar" id="sidebar">
            <nav>
                <a class="nav-item" href="/admin/index.html"><i aria-hidden="true" class="fa-solid fa-receipt"></i> Pesanan</a>
                <a class="nav-item" href="/admin/menu.html"><i aria-hidden="true" class="fa-solid fa-bowl-food"></i> Kelola Menu</a>
                <a class="nav-item active" href="/admin/reports.html"><i aria-hidden="true" class="fa-solid fa-file-excel"></i> Laporan</a>
                <a class="nav-item" href="/admin/settings.html"><i aria-hidden="true" class="fa-solid fa-gear"></i> Pengaturan</a>
            </nav>
        </aside>
        
        <main class="main-content">
            <div class="page-header">
                <h2>Laporan Penjualan Harian</h2>
                <p>Unduh rekapitulasi penjualan dan profit harian dalam format Excel atau PDF.</p>
            </div>

            <div class="panel" style="max-width: 600px;">
                <div class="panel-header">
                    <h3 style="font-size: 1.1rem; margin: 0;">Pilih Tanggal Laporan</h3>
                </div>
                <div class="panel-body" style="padding: 1.5rem;">
                    <div class="form-group">
                        <label class="form-label" for="reportDate">Tanggal</label>
                        <input type="date" id="reportDate" class="form-control">
                    </div>

                    <div style="display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap;">
                        <button class="btn" style="background: #10b981; color: white;" onclick="downloadExcel()">
                            <i aria-hidden="true" class="fa-solid fa-file-excel"></i> Unduh Excel
                        </button>
                        <button class="btn danger" onclick="downloadPdf()">
                            <i aria-hidden="true" class="fa-solid fa-file-pdf"></i> Unduh PDF
                        </button>
                    </div>
                </div>
            </div>
            <div style="text-align: center; padding: 2rem 1rem 0; color: var(--text-muted, #6b7280); font-size: 0.875rem; opacity: 0.7;">
                <p class="text-center text-xs text-gray-400 mt-6 font-medium">
                    by <a href="https://instagram.com/mail.huda" target="_blank"
                        class="hover:text-primary transition-colors">HudMail</a> (@mail.huda)
                </p>
            </div>
        </main>
    </div>

    <script src="/js/theme.js"></script>
    <script>
        initThemeToggle('theme-toggle');
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('toggle-sidebar');
        if(toggleBtn && sidebar) {
            toggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
        }
    </script>
    <script src="/admin/js/reports.js"></script>
</body>
</html>
